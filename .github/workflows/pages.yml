# Every push to main publishes the game to GitHub Pages (installable on iPhone from Safari, updates itself).
# pubspec.yaml → Flutter web build (Flame); package.json with "build" → npm build, dist/; otherwise the repo root as is.
name: Deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect project type
        run: |
          if [ -f pubspec.yaml ]; then echo "KIND=flutter" >> "$GITHUB_ENV"
          elif [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then echo "KIND=npm" >> "$GITHUB_ENV"
          else echo "KIND=static" >> "$GITHUB_ENV"; fi
      # same Flutter version as on the «Котик Колот» server, where the merge queue test-builds every change
      - if: env.KIND == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Build
        run: |
          case "$KIND" in
            flutter)
              flutter pub get
              flutter build web --release --base-href "/${{ github.event.repository.name }}/"
              echo "SITE_DIR=build/web" >> "$GITHUB_ENV" ;;
            npm)
              npm ci || npm install
              npm run build
              echo "SITE_DIR=dist" >> "$GITHUB_ENV" ;;
            *)
              mkdir -p _site
              rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
              echo "SITE_DIR=_site" >> "$GITHUB_ENV" ;;
          esac
      - name: Icons from web/icon.png, name from app.json, build id for the in-app update button
        run: |
          if [ -f web/icon.png ] && [ -f tool/icon.py ]; then
            pip install --quiet pillow
            python3 tool/icon.py --sizes "$SITE_DIR"
          fi
          [ -f app.json ] && [ -f tool/app_info.py ] && python3 tool/app_info.py "$SITE_DIR"
          echo "{\"build\":\"$GITHUB_SHA\"}" > "$SITE_DIR/build.json"
          [ -f "$SITE_DIR/index.html" ] && sed -i "s/__BUILD_ID__/$GITHUB_SHA/" "$SITE_DIR/index.html"
          # cache busting: Pages caches files for 10 min, so code URLs carry the commit — an update is visible at once
          [ -f "$SITE_DIR/index.html" ] && sed -i "s#flutter_bootstrap.js\"#flutter_bootstrap.js?v=$GITHUB_SHA\"#" "$SITE_DIR/index.html"
          [ -f "$SITE_DIR/flutter_bootstrap.js" ] && sed -i "s#\"mainJsPath\":\"main.dart.js\"#\"mainJsPath\":\"main.dart.js?v=$GITHUB_SHA\"#" "$SITE_DIR/flutter_bootstrap.js"
          true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
