<!DOCTYPE html>
<html lang="es">
<head>
  <!-- replaced by `flutter build web --base-href /dos-gatitos/` -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Dos Gatitos — juego de dos gatitos">
  <!-- GitHub Actions puts the commit sha here; the page compares it with build.json to offer updates -->
  <meta name="build-id" content="__BUILD_ID__">

  <!-- installable on iPhone: Safari → Compartir → «En pantalla de inicio» -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dos Gatitos">
  <meta name="theme-color" content="#1D1B2E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dos Gatitos</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #1D1B2E; overscroll-behavior: none; }
    #update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 10; display: none; border: 0; border-radius: 999px; padding: 12px 20px; background: #FFB02E; color: #1D1B2E;
      font: 600 16px system-ui, -apple-system, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    #splash { position: fixed; inset: 0; z-index: 20; background: #1D1B2E; transition: opacity .45s ease; }
    #splash video, #splash img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- splash.mp4 = intro (0-5 s) + its last two seconds backwards and forwards: after the intro the
       tail loops without a visible jump, until the game has drawn its first frame -->
  <div id="splash">
    <video id="splash-video" autoplay muted playsinline preload="auto"
      poster="splash.jpg?v=__BUILD_ID__"
      src="splash.mp4?v=__BUILD_ID__"></video>
  </div>
  <script>
    (function () {
      var LOOP_FROM = 5.0;   // seconds: start of the back-and-forth tail
      var MIN_SHOW = 4000;   // ms: room, characters, font and music are all there by then
      var splash = document.getElementById('splash');
      var video = document.getElementById('splash-video');
      var shown = Date.now();
      var done = false;
      function watch() {
        if (done) return;
        if (video.duration && video.currentTime >= video.duration - 0.06) video.currentTime = LOOP_FROM;
        requestAnimationFrame(watch);
      }
      requestAnimationFrame(watch);
      video.addEventListener('ended', function () { video.currentTime = LOOP_FROM; video.play(); });
      function hide() {
        if (done) return;
        setTimeout(function () {
          done = true;
          splash.classList.add('gone');
          setTimeout(function () { video.pause(); splash.remove(); }, 500);
        }, Math.max(0, MIN_SHOW - (Date.now() - shown)));
      }
      window.addEventListener('dg-ready', hide); // sent by the game when everything is loaded
      setTimeout(hide, 20000); // never trap the player behind the splash
    })();
  </script>
  <button id="update" onclick="location.reload()">🐾 Nueva versión — actualizar</button>
  <script>
    // new build on GitHub Pages → show the update button (checked on return to the app and every minute)
    (function () {
      var mine = document.querySelector('meta[name="build-id"]').content;
      if (mine.indexOf('__') === 0) return; // local build
      function check() {
        fetch('build.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
          if (j.build && j.build !== mine) document.getElementById('update').style.display = 'block';
        }).catch(function () {});
      }
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      setInterval(check, 60000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
